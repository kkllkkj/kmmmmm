<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'"><link rel="stylesheet" href="dashboard.css"></head><body><header><h1>小虎的陪伴日记</h1><p>做一点喜欢的事，留一点时间给自己。</p><strong id="balance"></strong></header><div id="error"></div><nav><button data-tab="tasks">任务与专注</button><button data-tab="shop">小虎食堂</button><button data-tab="review">每日复盘</button><button data-tab="history">陪伴记录</button><button data-tab="settings">陪伴设置</button></nav><main><section id="tasks"><form id="add"><input id="title" placeholder="添加一件想做的事…" maxlength="200" required><select id="reward"><option>5</option><option selected>15</option><option>25</option><option>40</option></select><button>添加任务</button></form><div id="session"></div><p class="hint">点击开始，与小虎一起学习或锻炼；结束计时后，勾选完成领取积分。</p><div id="task-list"></div></section><section id="shop" hidden><p>所有食物均可增加亲密度。免费基础口粮一直供应。</p><button id="free">免费饭团 🍙</button><div id="foods" class="grid"></div></section><section id="review" hidden><label>回顾这一天<input type="date" id="day"></label><label>今天的心情<select id="mood"><option>平静</option><option>开心</option><option>疲惫</option><option>低落</option><option>焦虑</option><option>复杂</option></select></label><label>今天有什么值得学习？<textarea id="learning" rows="5"></textarea></label><label>想留给自己的话（可选）<textarea id="note" rows="4"></textarea></label><button id="save-review">保存复盘</button><span id="review-status"></span></section><section id="history" hidden></section><section id="settings" hidden><h2>互动与才艺</h2><div id="talents"></div><label><input type="checkbox" id="quiet">安静陪伴（减少刷新，停止自主活动和随机话语）</label><label>自主活动间隔<select id="activityInterval"><option value="0">关闭</option><option value="120">2 分钟</option><option value="300">5 分钟</option><option value="600">10 分钟</option></select></label><label>日常话语间隔<select id="quoteInterval"><option value="0">关闭</option><option value="120">2 分钟</option><option value="300">5 分钟</option><option value="600">10 分钟</option><option value="1800">30 分钟</option></select></label><p class="hint">语录完整显示。唱歌和写歌目前为动作与台词，无声音。Windows 版暂未接入其他应用全屏检测。</p></section></main><script src="common.js"></script><script src="dashboard.js"></script></body></html>
